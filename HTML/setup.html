<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Set Up Your Budget</title>

    <link rel="stylesheet" href="style.css" />
  </head>

  <body class="setup-page">
    <div class="setup-container">
      <!-- Logo -->
      <div class="setup-logo">📊</div>

      <!-- Heading -->
      <h1>Set Up Your Budget</h1>

      <p class="setup-description">
        Let's start by adding your monthly financial details.
      </p>

      <!-- Budget Form -->
      <form id="budgetForm" action="dashboard.html" method="get">
        <!-- Monthly Income -->
        <div class="form-group">
          <label for="monthlyIncome"> Total Monthly Income </label>

          <input
            type="number"
            id="monthlyIncome"
            name="monthlyIncome"
            placeholder="Enter your monthly income"
            min="1"
            required
          />
        </div>

        <!-- Button -->
        <button type="submit" id="budgetButton">Set My Budget →</button>
      </form>

      <p class="setup-note">
        🔒 Your financial information stays on this device.
      </p>
    </div>

    <!-- Setup Page JavaScript -->
    <script>
      const budgetForm = document.getElementById("budgetForm");

      budgetForm.addEventListener("submit", function (event) {
        event.preventDefault();

        const incomeInput = document.getElementById("monthlyIncome");

        const income = Number(incomeInput.value);

        /* Validate income */

        if (income <= 0 || isNaN(income)) {
          alert("Please enter a valid monthly income.");

          return;
        }

        /* Save income */

        localStorage.setItem("monthlyIncome", income);

        /* Move to dashboard */

        window.location.href = "dashboard.html";
      });
    </script>
  </body>
</html>
